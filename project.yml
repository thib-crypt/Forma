name: Forma
options:
  bundleIdPrefix: com.thibault
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: fr
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: PG46BWSK3T
    OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    DEAD_CODE_STRIPPING: YES
targets:
  Forma:
    type: application
    platform: macOS
    sources:
      - path: Forma
    dependencies:
      - target: FormaFinder
      - target: FormaShare
    scheme:
      testTargets: [FormaTests]
    entitlements:
      path: Forma/Forma.entitlements
      properties:
        com.apple.security.application-groups: [PG46BWSK3T.com.thibault.forma]
    info:
      path: Forma/Info.plist
      properties:
        CFBundleDisplayName: Forma
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "26.0"
        CFBundleURLTypes:
          - CFBundleURLName: com.thibault.forma
            CFBundleURLSchemes: [forma]
        NSHumanReadableCopyright: "© 2026 Thibault Thevenin"
        NSDesktopFolderUsageDescription: "Forma enregistre les fichiers convertis à côté des originaux."
        NSDocumentsFolderUsageDescription: "Forma enregistre les fichiers convertis à côté des originaux."
        NSDownloadsFolderUsageDescription: "Forma enregistre les fichiers convertis à côté des originaux."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie]
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
          - CFBundleTypeName: Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, com.adobe.postscript, com.adobe.encapsulated-postscript, com.adobe.illustrator.ai-image]
          - CFBundleTypeName: Office document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.openxmlformats.wordprocessingml.document
              - com.microsoft.word.doc
              - org.oasis-open.opendocument.text
              - public.rtf
              - com.apple.rtfd
              - public.plain-text
              - public.html
              - com.apple.webarchive
              - net.daringfireball.markdown
              - org.idpf.epub-container
              - org.openxmlformats.spreadsheetml.sheet
              - com.microsoft.excel.xls
              - org.oasis-open.opendocument.spreadsheet
              - public.comma-separated-values-text
              - org.openxmlformats.presentationml.presentation
              - com.microsoft.powerpoint.ppt
              - org.oasis-open.opendocument.presentation
              - com.apple.iwork.pages.sffpages
              - com.apple.iwork.numbers.sffnumbers
              - com.apple.iwork.keynote.sffkey
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
        NSServices:
          - NSMenuItem: { default: "Forma — Ajouter" }
            NSMessage: addFiles
            NSPortName: Forma
            NSRequiredContext: {}
            NSSendFileTypes: [public.item]
          - NSMenuItem: { default: "Forma — Convertir" }
            NSMessage: convertFiles
            NSPortName: Forma
            NSRequiredContext: {}
            NSSendFileTypes: [public.item]
          - NSMenuItem: { default: "Forma — Compresser" }
            NSMessage: compressFiles
            NSPortName: Forma
            NSRequiredContext: {}
            NSSendFileTypes: [public.item]
          - NSMenuItem: { default: "Forma — Agrandir ×2 (IA)" }
            NSMessage: upscaleFiles
            NSPortName: Forma
            NSRequiredContext: {}
            NSSendFileTypes: [public.image]
          - NSMenuItem: { default: "Forma — Envoyer sur Drop" }
            NSMessage: dropFiles
            NSPortName: Forma
            NSRequiredContext: {}
            NSSendFileTypes: [public.item]
    settings:
      base:
        PRODUCT_NAME: Forma
        PRODUCT_BUNDLE_IDENTIFIER: com.thibault.forma
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO

  FormaFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: FormaFinder
      - path: Forma/Shared
    info:
      path: FormaFinder/Info.plist
      properties:
        CFBundleDisplayName: Forma
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Menu Forma dans le Finder"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FinderSync"
          NSExtensionAttributes: {}
    entitlements:
      path: FormaFinder/FormaFinder.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [PG46BWSK3T.com.thibault.forma]
    settings:
      base:
        PRODUCT_NAME: FormaFinder
        PRODUCT_BUNDLE_IDENTIFIER: com.thibault.forma.FinderMenu
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES

  FormaShare:
    type: app-extension
    platform: macOS
    sources:
      - path: FormaShare
      - path: Forma/Shared
    info:
      path: FormaShare/Info.plist
      properties:
        CFBundleDisplayName: Forma
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Convertir avec Forma depuis le menu Partager"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 500
              NSExtensionActivationSupportsImageWithMaxCount: 500
              NSExtensionActivationSupportsMovieWithMaxCount: 100
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 500
    entitlements:
      path: FormaShare/FormaShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [PG46BWSK3T.com.thibault.forma]
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_NAME: FormaShare
        PRODUCT_BUNDLE_IDENTIFIER: com.thibault.forma.Share
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES

  FormaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FormaTests
      - path: Forma/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thibault.forma.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
